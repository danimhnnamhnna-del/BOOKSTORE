<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookstore - Home</title>

    <!-- Tailwind (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            boxShadow: {
              soft: "0 10px 30px rgba(0,0,0,0.08)",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <nav class="mx-auto max-w-7xl px-4">
        <div class="flex items-center justify-between w-full gap-4">
          <div class="logo font-bold text-white">BookStore</div>

          <ul class="hidden md:flex items-center gap-5">
            <div class="flex items-center gap-3">
              <button
                id="themeToggler"
                type="button"
                class="rounded-full bg-white/15 px-3 py-2 text-sm font-semibold text-white hover:bg-white/25 transition"
                aria-label="Toggle theme"
              >
                <span id="themeTogglerLabel">Dark</span>
              </button>
            </div>
            <li><a href="index.html" class="hover:underline">Home</a></li>
            <li><a href="#" class="hover:underline">Categories</a></li>
            <li>
              <a href="../admin/index.html" class="hover:underline">Admin Portal</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <div class="container">
      <section class="search-section">
        <input
          type="text"
          id="searchInput"
          class="search-field"
          placeholder="Search by title, author, or Category..."
        />
        <button class="btn btn-primary" onclick="searchBooks()">Search</button>
      </section>

      <section class="mt-8">
        <div class="flex items-end justify-between gap-4 flex-wrap">
          <p class="text-sm text-slate-600 dark:text-slate-300">
            Books with fewer than 3 copies are not available for borrow at this time.
          </p>
        </div>

        <div id="bookGrid" class="book-grid mt-6">
          <!-- Books will be loaded here -->
        </div>
      </section>
    </div>

    <!-- No borrow/purchase modals or forms -->

    <script src="../js/api.js"></script>
    <script>
      const ASSET_BASE_URL = API_BASE_URL.replace(/\/api$/, "");
      const MIN_STOCK_FOR_BORROW = 3;
      let availableBooks = [];

      function formatCurrency(value) {
        return Number(value || 0).toLocaleString("en-US", {
          style: "currency",
          currency: "USD",
        });
      }

      async function loadBooks() {
        const books = await api.get("/books");
        // Hide books with 0 or negative stock
        availableBooks = books.filter(b => Number(b.count) > 0);
        displayBooks(availableBooks);
      }

      async function searchBooks() {
        const query = document.getElementById("searchInput").value.trim();
        const url = query
          ? `/books/search?q=${encodeURIComponent(query)}`
          : "/books";
        const books = await api.get(url);
        availableBooks = books.filter(b => Number(b.count) > 0);
        displayBooks(availableBooks);
      }

      function getStockBadge(book) {
        const count = Number(book.count ?? 0);
        if (count < MIN_STOCK_FOR_BORROW) {
          return {
            label: `Limited stock (${count})`,
            className:
              "bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-200 border border-amber-200/70 dark:border-amber-900/60",
          };
        }
        return {
          label: `Available`,
          className:
            "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200 border border-emerald-200/70 dark:border-emerald-900/60",
        };
      }

      function displayBooks(books) {
        document.body.classList.add("bg-slate-50", "text-slate-900");
        if (document.documentElement.classList.contains("dark")) {
          document.body.classList.add("bg-slate-950", "text-slate-100");
        }
        document.getElementById("bookGrid").classList.add("grid", "gap-6");
        const grid = document.getElementById("bookGrid");
        grid.innerHTML = books
          .map((book) => {
            const bookCount = Number(book.count ?? 0);
            const isAvailable = bookCount >= MIN_STOCK_FOR_BORROW;
            const stock = getStockBadge(book);

            return `
              <div class="group rounded-2xl border border-slate-200/70 bg-white/90 backdrop-blur dark:bg-slate-900/40 dark:border-slate-800 shadow-sm hover:shadow-soft transition overflow-hidden">
                <div class="relative">
                  ${
                    book.coverImage
                      ? `<img src="${ASSET_BASE_URL}${book.coverImage}" alt="${book.name}" class="w-full h-48 object-cover" />`
                      : `<div class="w-full h-48 bg-emerald-200 dark:bg-emerald-800/30"></div>`
                  }
                  <div class="absolute top-3 left-3 px-3 py-1 rounded-full text-xs font-bold ${stock.className}">
                    ${stock.label}
                  </div>
                </div>

                <div class="p-4">
                  <div class="min-h-[56px]">
                    <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100 line-clamp-2">${book.name}</h3>
                    <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">by <span class="font-semibold">${book.author}</span></p>
                  </div>

                  <div class="mt-3 grid grid-cols-2 gap-2 text-sm">
                    <div class="rounded-xl bg-slate-50 dark:bg-white/5 p-2 border border-slate-100 dark:border-white/10">
                      <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">Category</p>
                      <p class="font-semibold text-slate-800 dark:text-slate-100">${book.category || "-"}</p>
                    </div>
                    <div class="rounded-xl bg-slate-50 dark:bg-white/5 p-2 border border-slate-100 dark:border-white/10">
                      <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">Price</p>
                      <p class="font-semibold text-slate-800 dark:text-slate-100">${formatCurrency(book.price || 0)}</p>
                    </div>
                    <div class="rounded-xl bg-slate-50 dark:bg-white/5 p-2 border border-slate-100 dark:border-white/10 col-span-2">
                      <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">Borrow Fee / Day</p>
                      <p class="font-semibold text-slate-800 dark:text-slate-100">${formatCurrency(book.borrowFeeDaily || 0)}</p>
                    </div>
                  </div>

                  ${
                    isAvailable
                      ? ""
                      : `
                    <div class="mt-4 flex justify-center">
                      <p class="text-sm font-semibold text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-900/20 px-4 py-2 rounded-lg border border-orange-200 dark:border-orange-800">
                        This book is not available for borrow
                      </p>
                    </div>`
                  }
                </div>
              </div>
            `;
          })
          .join("");
      }

      function initThemeToggler() {
        const root = document.documentElement;
        const key = "theme";
        const saved = localStorage.getItem(key);
        const initialDark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        root.classList.toggle("dark", initialDark);

        const btn = document.getElementById("themeToggler");
        const label = document.getElementById("themeTogglerLabel");

        function updateLabel() {
          const isDark = root.classList.contains("dark");
          if (label) label.textContent = isDark ? "Light" : "Dark";
        }

        btn?.addEventListener("click", () => {
          const nextDark = !root.classList.contains("dark");
          root.classList.toggle("dark", nextDark);
          localStorage.setItem(key, nextDark ? "dark" : "light");
          updateLabel();
        });

        updateLabel();
      }

      window.onload = async () => {
        initThemeToggler();
        await loadBooks();
      };
    </script>
  </body>
</html>
